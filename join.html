<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Únete a tu viaje en YOKA</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #F5F5F5;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 32px 28px;
    max-width: 380px;
    width: 90%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  .logo { font-size: 28px; font-weight: 800; color: #1A1A2E; margin-bottom: 4px; }
  .subtitle { color: #9CA3AF; font-size: 14px; margin-bottom: 24px; }
  .code-box {
    background: #F0F4FF;
    border-radius: 14px;
    padding: 18px;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 8px;
    color: #1A1A2E;
    margin-bottom: 24px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    margin-bottom: 12px;
    box-sizing: border-box;
  }
  .btn-primary { background: #1A1A2E; color: #fff; }
  .hint { color: #9CA3AF; font-size: 12px; margin-top: 16px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">YOKA</div>
    <div class="subtitle">Te han invitado a un viaje</div>
    <div class="code-box" id="code">------</div>
    <a id="cta" class="btn btn-primary" href="#">Descargar / abrir la app</a>
    <div class="hint">
      Si ya tienes la app instalada, este enlace debería haberla abierto
      directamente. Si has llegado a esta página, ábrelo desde el navegador
      (no desde dentro de WhatsApp/Instagram) o introduce el código a mano
      dentro de YOKA.
    </div>
  </div>

  <script>
    // TODO: sustituye por el link real de TestFlight en cuanto lo tengas —
    // no llegó a pasarse en la conversación, así que de momento apunta a
    // un marcador de posición.
    const TESTFLIGHT_URL = 'https://testflight.apple.com/join/E4zUBVyx';
    const PLAY_INTERNAL_TEST_URL = 'https://play.google.com/apps/internaltest/4700528518409774107';

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || '';
    document.getElementById('code').textContent = code || '------';

    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isAndroid = /android/i.test(ua);

    const cta = document.getElementById('cta');
    cta.href = isAndroid ? PLAY_INTERNAL_TEST_URL : TESTFLIGHT_URL;
  </script>
</body>
</html>
