<title>Descarga YOKA</title>
<script>
  // Manda a cada móvil a su tienda antes de pintar nada.
  (function(){
    var ua = navigator.userAgent || '';
    var iOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var android = /Android/i.test(ua);
    // Cuenta la visita en GoatCounter antes de salir (sin cookies; keepalive aguanta la redirección).
    function count(p){
      try {
        // De dónde viene: ?utm_source=instagram (o ?ref=) si el enlace lo lleva; si no, la web anterior.
        var q = new URLSearchParams(location.search);
        var from = q.get('utm_source') || q.get('ref') || document.referrer || '';
        fetch('https://goyokatravel.goatcounter.com/count?p=' + encodeURIComponent(p) +
              '&r=' + encodeURIComponent(from) + '&rnd=' + Math.random(),
              {keepalive: true, mode: 'no-cors'});
      } catch (e) {}
    }
    if (iOS) { count('/descarga/iphone'); location.replace('https://apps.apple.com/es/app/yoka-viaja-con-amigos/id6808558555'); }
    else if (android) { count('/descarga/android'); location.replace('/android.html'); }
  })();
</script>

  .sub{margin:0 0 26px;color:var(--muted);font-size:17px}
  .btns{display:grid;gap:12px;margin-bottom:28px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;border-radius:16px;padding:16px;transition:filter .15s}

  .ios{background:#14213D;color:#fff}
  .and{background:var(--yellow);color:#14213D}
  .and small{font-family:Nunito,sans-serif;font-weight:800;font-size:12px;background:#14213D;color:var(--yellow);border-radius:999px;padding:3px 8px}
  .qr{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px}
  .qr img{width:200px;height:200px;display:block;margin:0 auto 10px;border-radius:12px}
  .qr p{margin:0;color:var(--muted);font-size:15px}
  footer{margin-top:28px;font-size:13px;color:var(--muted)}
  footer a{color:inherit}
